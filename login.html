<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Acceso a la Intranet Banasan." />
  <meta name="theme-color" content="#062b4a" />
  <title>Intranet</title>
  <link rel="icon" href="assets/brand/simbolo-banasan.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/foundation.css?v=1" />
  <link rel="stylesheet" href="assets/css/login.css?v=6" />
  <link rel="stylesheet" href="assets/css/components.css?v=1" />
  <script src="assets/js/login.js?v=4" defer></script>
</head>
<body class="archive-page">
  <a class="skip-link" href="#login-form">Ir al formulario de acceso</a>
  <main class="archive-shell archive-shell--selected">
    <img class="archive-art" src="assets/art/living-archive-banasan-real-v5.png" alt="Cultivo de banano Banasan" />
    <header class="archive-header identity-lockup">
      <span class="identity-product"><strong>Intranet</strong><small>Portal corporativo</small></span>
      <span class="identity-endorsement"><img src="assets/brand/logo-banasan.svg" alt="Banasan" /></span>
    </header>
    <section class="archive-manifesto" aria-labelledby="archive-title">
      <h1 id="archive-title">Información y servicios para tu trabajo diario.</h1>
      <p>Consulta recursos, novedades y herramientas internas de Banasan.</p>
    </section>
    <section class="archive-access" aria-labelledby="access-title">
      <div class="access-intro">
        <h2 id="access-title">Bienvenido.</h2>
        <p>Ingresa con tu correo corporativo y contraseña.</p>
      </div>
      <form class="login-form login-form--selected" id="login-form" novalidate>
        <div class="field"><label for="email">Correo corporativo</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="nombre@banasan.com.co" aria-describedby="email-error" required /><p class="field__error" id="email-error" role="alert"></p></div>
        <div class="field field--password"><label for="password">Contraseña</label><div class="password-control"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" aria-describedby="password-error" required /><button class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false"><span>Mostrar</span></button></div><a class="recovery-link" href="#recovery">¿Olvidaste tu contraseña?</a><p class="field__error" id="password-error" role="alert"></p></div>
        <label class="remember"><input type="checkbox" name="remember" /><span>Mantener mi sesión iniciada</span></label>
        <button class="submit-button" type="submit"><span class="submit-button__label">Ingresar</span><span class="submit-button__loader" aria-hidden="true"></span></button><div class="form-feedback" role="status" aria-live="polite"></div>
      </form>
      <footer class="access-footer"><span>© 2026 C.I. Banasan S.A.S.</span><a href="#support">Soporte TI</a></footer>
    </section>
  </main>
</body>
</html>
